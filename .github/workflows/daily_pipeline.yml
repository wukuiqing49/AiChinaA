name: Daily A-Share Quant Pipeline

on:
  schedule:
    # Post-close historical settlement at 15:35 Beijing Time (07:35 UTC), weekdays.
    - cron: '35 7 * * 1-5'
  workflow_dispatch:

concurrency:
  group: a-share-daily-refresh
  cancel-in-progress: false

jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      is_open: ${{ steps.calendar.outputs.is_open }}
      expected_trade_date: ${{ steps.calendar.outputs.expected_trade_date }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install uv==0.13.6 && uv sync --locked --no-dev
      - id: calendar
        run: uv run --no-sync python -m pipeline.jobs.trading_day

  run-pipeline:
    needs: calendar
    if: ${{ needs.calendar.outputs.is_open == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
      PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install uv==0.13.6
          uv sync --locked --no-dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check publishing schema before historical processing
        run: python -m pipeline.jobs.publish_preflight

      - name: Restore historical snapshot from R2
        run: |
          set -euo pipefail
          if [ -z "$R2_ENDPOINT" ] || [ -z "$R2_BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::R2 secrets are missing. Configure R2_ENDPOINT, R2_BUCKET, R2_ACCESS_KEY_ID, and R2_SECRET_ACCESS_KEY."
            exit 1
          fi
          if ! aws s3 ls "s3://${R2_BUCKET}/historical-current.zip" --endpoint-url "$R2_ENDPOINT" >/dev/null 2>&1; then
            echo "::error::R2 snapshot historical-current.zip is missing. Run the Initialize A-Share Historical Snapshot workflow before the daily settlement."
            exit 1
          fi
          aws s3 cp "s3://${R2_BUCKET}/historical-current.zip" data/snapshots/historical-current.zip --endpoint-url "$R2_ENDPOINT"
          python -m pipeline.jobs.snapshot_history --verify data/snapshots/historical-current.zip
          unzip -q data/snapshots/historical-current.zip -d data
          test -f data/historical/checkpoints.json

      - name: Append post-close daily K-lines
        run: |
          python -m pipeline.jobs.download_history --repair-names
          python -m pipeline.jobs.download_history --incremental --workers 4

      - name: Create and upload refreshed snapshot
        run: |
          python -m pipeline.jobs.snapshot_history --output data/snapshots/historical-current.zip
          python -m pipeline.jobs.snapshot_history --verify data/snapshots/historical-current.zip
          aws s3 cp data/snapshots/historical-current.zip "s3://${R2_BUCKET}/history/${GITHUB_RUN_ID}.zip" --endpoint-url "$R2_ENDPOINT"
          aws s3 cp data/snapshots/historical-current.zip "s3://${R2_BUCKET}/historical-current.zip" --endpoint-url "$R2_ENDPOINT"

      - name: Fetch real-time market snapshot
        run: |
          python -m pipeline.jobs.fetch_realtime_quotes --data-dir data/historical

      - name: Compute Screener & Multi-Factor Scores
        run: |
          python -m pipeline.jobs.build_screener --data-dir data/historical --output reports/screener-publish.json --expected-trade-date "${{ needs.calendar.outputs.expected_trade_date }}"

      - name: Preserve resumable publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: screener-publish
          path: reports/screener-publish.json
          retention-days: 30
      - name: Save immutable publish package to R2
        run: aws s3 cp reports/screener-publish.json "s3://${R2_BUCKET}/publishes/${GITHUB_RUN_ID}/screener.json" --endpoint-url "$R2_ENDPOINT"
      - name: Publish to Worker
        id: publish_core
        run: |
          python -m pipeline.jobs.publish_screener --input reports/screener-publish.json --timeout 300

      - name: Core refresh summary
        if: ${{ always() }}
        run: echo "Core publication ${{ steps.publish_core.outcome }} (job ${{ job.status }})" >> "$GITHUB_STEP_SUMMARY"

  supplemental:
    needs: calendar
    if: ${{ needs.calendar.outputs.is_open == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - dataset: industry-map
            module: industry_map
          - dataset: fund-flow
            module: fund_flow
          - dataset: industry-fund-flow
            module: industry_fund_flow
          - dataset: valuation
            module: valuation
          - dataset: financials
            module: financials
    env:
      PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
      PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
      DATASET: ${{ matrix.dataset }}
      DATASET_MODULE: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install uv==0.13.6
          uv sync --locked --no-dev
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Check dataset publishing schema
        run: python -m pipeline.jobs.publish_preflight --dataset "$DATASET"
      - name: Fetch independent dataset
        id: fetch
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if python -m "pipeline.jobs.fetch_${DATASET_MODULE}" --output "data/realtime/${DATASET}.json"; then
              exit 0
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 20
          done
      - name: Preserve dataset for publication recovery
        uses: actions/upload-artifact@v4
        with:
          name: publish-${{ matrix.dataset }}
          path: data/realtime/${{ matrix.dataset }}.json
          retention-days: 30
      - name: Publish independent dataset
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          extra_args=()
          if [ "$DATASET" = industry-fund-flow ]; then extra_args+=(--persist-history); fi
          python -m "pipeline.jobs.publish_${DATASET_MODULE}" --input "data/realtime/${DATASET}.json" "${extra_args[@]}"
      - name: Dataset summary
        if: ${{ always() }}
        run: |
          echo "${DATASET}: fetch=${{ steps.fetch.outcome }}, publish=${{ steps.publish.outcome }}, job=${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"

  cleanup:
    needs: [calendar, run-pipeline, supplemental]
    if: ${{ always() && needs.calendar.outputs.is_open == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
      PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded dataset retention
        continue-on-error: true
        run: python -m pipeline.jobs.cleanup_datasets
