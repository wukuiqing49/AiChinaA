name: Sync stock screener data

on:
  workflow_dispatch:
  schedule:
    - cron: "35 9 * * 1-5"

concurrency:
  group: screener-sync-production
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline
        run: python -m pip install --upgrade pip && pip install .
      - name: Build screener package
        run: python -m pipeline.jobs.build_screener --max-stocks 300 --workers 4
      - name: Publish screener package
        run: python -m pipeline.jobs.publish_screener --input reports/screener-publish.json
        env:
          PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
          PUBLISH_SECRET: ${{ secrets.PUBLISH_SECRET }}
